# Governing service for the StatefulSet (stable pod DNS: redis-0.redis-headless).
apiVersion: v1
kind: Service
metadata:
  namespace: dev
  name: redis-headless
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
# What clients connect to.
apiVersion: v1
kind: Service
metadata:
  namespace: dev
  name: redis-service
spec:
  selector:
    app: redis
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
