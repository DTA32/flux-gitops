# Let's Encrypt issuer for cert-manager. The HTTP-01 challenge is solved through
# the Gateway itself (cert-manager spins up temporary HTTPRoutes on the :80 listener).
# Requires cert-manager installed with Gateway API support enabled (see README).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bandung2003@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: main-gateway
                namespace: envoy
                kind: Gateway
                group: gateway.networking.k8s.io
