# Hand-built today; there is no pipeline emitting sortable tags for it, so this policy
# will report "no image found" until that build moves to its own repo. The CronJob in
# apps/production/postgres-backup-r2/ is deliberately left without an $imagepolicy
# marker so Flux cannot bump it to a tag that will never exist.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: postgres-backup-r2
  namespace: flux-system
spec:
  image: docker.io/dta32/postgresql-backup-r2
  interval: 10m
  secretRef:
    name: flux-registry-creds
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: postgres-backup-r2
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: postgres-backup-r2
  filterTags:
    pattern: '^(?P<ts>[0-9]+)-[0-9a-f]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
