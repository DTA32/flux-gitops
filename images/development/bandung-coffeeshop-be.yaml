apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: bandung-coffeeshop-be-dev
  namespace: flux-system
spec:
  image: ghcr.io/dta32/bandung-coffeeshop-be/dev
  interval: 10m
  secretRef:
    name: flux-registry-creds
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: bandung-coffeeshop-be-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: bandung-coffeeshop-be-dev
  filterTags:
    pattern: '^(?P<ts>[0-9]+)-[0-9a-f]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
