apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: dev
  name: job-scrapper-revamp-bot
spec:
  suspend: true
  schedule: "0 8,20 * * *"
  timeZone: "Asia/Jakarta"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2100
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node_type
                        operator: In
                        values:
                          - high-availability
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: job-scrapper-revamp-bot
              image: ghcr.io/pt-sinan-akbar/job-scraper/dev:1795269380-3361eb3 # {"$imagepolicy": "flux-system:job-scrapper-revamp-dev"}
              imagePullPolicy: IfNotPresent
              command:
                - /app/scripts/scrape-to-discord.sh
              args:
                - software engineer
              env:
                - name: SCRAPER_UI_URL
                  value: http://job-scrapper-revamp-service.dev.svc.cluster.local:8090
                - name: AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: job-scrapper-revamp-secret
                      key: AUTH_TOKEN
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"
          restartPolicy: Never
