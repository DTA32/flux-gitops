apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-scrapper-revamp-dev
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: dev-job-scraper
  hostnames:
    - dev.job-scraper.dimasdanizaini.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: job-scrapper-revamp-service.dev.svc.cluster.local
      backendRefs:
        - name: job-scrapper-revamp-service
          namespace: dev
          port: 8090
