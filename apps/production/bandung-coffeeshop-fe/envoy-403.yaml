# Envoy Gateway HTTPRouteFilter for blocking access to monitoring endpoints
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: bdgcafe-fe-deny-monitoring
  namespace: envoy
spec:
  directResponse:
    statusCode: 403
    body:
      type: Inline
      inline: "Forbidden"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bandung-coffeeshop-fe-monitoring-deny
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: bdgcafe-com
  hostnames:
    - bdgcafe.com
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: "^/(health|ready|metrics)/?$"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bdgcafe-fe-deny-monitoring
