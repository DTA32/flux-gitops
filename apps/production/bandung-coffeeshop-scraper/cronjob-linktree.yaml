apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: prod
  name: bandung-coffeeshop-scraper-linktree
spec:
  schedule: "0 6 * * *"
  timeZone: "Asia/Jakarta"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app: bandung-coffeeshop-scraper
        spec:
          nodeSelector:
            node_type: spot
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: bandung-coffeeshop-scraper
              image: ghcr.io/dta32/bandung-coffeeshop-scraper/prod:1792271649-5d8a68b # {"$imagepolicy": "flux-system:bandung-coffeeshop-scraper"}
              imagePullPolicy: IfNotPresent
              args: ["run", "--source=linktree"]
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "20m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: bandung-coffeeshop-scraper-config
                - secretRef:
                    name: bandung-coffeeshop-scraper-secret
