apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: prod
  name: job-scraper-bot
spec:
  schedule: "0 8,20 * * *"
  timeZone: "Asia/Jakarta"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node_type
                        operator: In
                        values:
                          - high-availability
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: job-scraper-bot
              image: ghcr.io/orangemangodimz/job-scrapper:bot-e4dda67e677a6c5121c9e63dd395fdd0aea88146
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /workspace/scraper-bot/cron/run-scraper.sh
              envFrom:
                - configMapRef:
                    name: job-scraper-config
                - secretRef:
                    name: job-scraper-secret
          restartPolicy: OnFailure
