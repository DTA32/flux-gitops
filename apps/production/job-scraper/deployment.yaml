apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: job-scraper-mcp
  labels:
    app: job-scraper-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-scraper-mcp
  template:
    metadata:
      labels:
        app: job-scraper-mcp
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node_type
                    operator: In
                    values:
                      - spot
      containers:
        - name: job-scraper-mcp
          image: ghcr.io/pt-sinan-akbar/job-scraper-mcp:ab3ab6f8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: job-scraper-config
            - secretRef:
                name: job-scraper-secret
