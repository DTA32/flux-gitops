apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-agent-be
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: job-agent
  hostnames:
    - job-agent.dta32.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: job-agent-be-service
          namespace: prod
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /static
        - path:
            type: Exact
            value: /schema
      backendRefs:
        - name: job-agent-be-service
          namespace: prod
          port: 80
