apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: vern
  labels:
    app: vern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vern
  template:
    metadata:
      labels:
        app: vern
    spec:
      containers:
        - name: vern
          image: ghcr.io/pt-sinan-akbar/vern:3b93e4e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: APP_NAME
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: APP_ENV
            - name: APP_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: APP_DEBUG
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: APP_URL
            - name: SESSION_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: SESSION_DOMAIN
            - name: SANCTUM_STATEFUL_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: SANCTUM_STATEFUL_DOMAINS
            - name: LOG_CHANNEL
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: LOG_CHANNEL
            - name: LOG_DEPRECATIONS_CHANNEL
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: LOG_DEPRECATIONS_CHANNEL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: LOG_LEVEL
            - name: BROADCAST_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: BROADCAST_DRIVER
            - name: CACHE_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: CACHE_DRIVER
            - name: FILESYSTEM_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: FILESYSTEM_DRIVER
            - name: QUEUE_CONNECTION
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: QUEUE_CONNECTION
            - name: SESSION_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: SESSION_DRIVER
            - name: SESSION_LIFETIME
              valueFrom:
                configMapKeyRef:
                  name: vern-config
                  key: SESSION_LIFETIME
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: APP_KEY
            - name: DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: DB_CONNECTION
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: DB_DATABASE
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: DB_PASSWORD
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: DB_USERNAME
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: GOOGLE_REDIRECT_URL
            - name: MAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MAIL_FROM_ADDRESS
            - name: MAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MAIL_FROM_NAME
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MAIL_HOST
            - name: MAIL_MAILER
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MAIL_MAILER
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MAIL_PASSWORD
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MAIL_PORT
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MAIL_USERNAME
            - name: MIDTRANS_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MIDTRANS_CLIENT_KEY
            - name: MIDTRANS_MERCHANT_ID
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MIDTRANS_MERCHANT_ID
            - name: MIDTRANS_PRODUCTION
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MIDTRANS_PRODUCTION
            - name: MIDTRANS_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: vern-secret
                  key: MIDTRANS_SERVER_KEY
