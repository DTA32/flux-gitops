# Basic-auth guard on /swagger for api.splitbill.dta32.my.id
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: split-bill-be-swagger
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: splitbill-api
  hostnames:
    - api.splitbill.dta32.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /swagger
      backendRefs:
        - name: split-bill-be-service
          namespace: prod
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: split-bill-be-swagger-basicauth
  namespace: envoy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: split-bill-be-swagger
  basicAuth:
    users:
      name: split-bill-be-basic-auth
