apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-agent-fe
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: job-agent
  hostnames:
    - job-agent.dta32.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: job-agent-fe-service
          namespace: prod
          port: 80
