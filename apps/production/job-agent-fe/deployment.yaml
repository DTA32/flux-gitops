apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: job-agent-fe
  labels:
    app: job-agent-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-agent-fe
  template:
    metadata:
      labels:
        app: job-agent-fe
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: job-agent-fe
          image: ghcr.io/dta32/job-agent-fe/prod:0-0000000 # {"$imagepolicy": "flux-system:job-agent-fe"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
