apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: job-scrapper-revamp
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: job-scraper
  hostnames:
    - job-scraper.dimasdanizaini.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: job-scrapper-revamp-service.prod.svc.cluster.local
      backendRefs:
        - name: job-scrapper-revamp-service
          namespace: prod
          port: 8090
