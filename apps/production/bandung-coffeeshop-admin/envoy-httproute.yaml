apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bandung-coffeeshop-admin
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: mission-control-bdgcafe-com
  hostnames:
    - mission-control.bdgcafe.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bandung-coffeeshop-admin-service
          namespace: prod
          port: 80
