# The write-back half: reads every ImagePolicy, rewrites the tag on any image line
# carrying a `# {"$imagepolicy": ...}` marker, and pushes the commit straight to master.
# The GitRepository it pushes through is the one `flux bootstrap --read-write-key`
# creates, so the deploy key must have write access.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(images): automated tag bump

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: master
  update:
    path: ./
    strategy: Setters
